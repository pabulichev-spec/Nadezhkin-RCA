name: Android Release APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "constants/**"
      - "hooks/**"
      - "lib/**"
      - "scripts/**"
      - "assets/**"
      - "app.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/android-release.yml"

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

env:
  JAVA_VERSION: "17"
  NODE_VERSION: "20"
  PNPM_VERSION: "9.12.0"
  ANDROID_API_LEVEL: "35"
  ANDROID_BUILD_TOOLS: "35.0.0"
  ANDROID_NDK_VERSION: "27.1.12297006"

jobs:
  build-release-apk:
    name: Build arm64-v8a Release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -x "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses >/dev/null || true

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(find "${ANDROID_SDK_ROOT:-${ANDROID_HOME}}/cmdline-tools" -type f -name sdkmanager -print -quit)"
          "$SDKMANAGER" "platform-tools" \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      # android/ is intentionally generated by Expo and ignored by Git.
      - name: Generate native Android project
        run: pnpm exec expo prebuild --platform android --clean --no-install

      - name: Configure optional release signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 --decode > android/app/release.keystore
            {
              echo "ORG_GRADLE_PROJECT_RELEASE_STORE_FILE=release.keystore"
              echo "ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS=$KEY_ALIAS"
              echo "ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Release signing keystore configured from GitHub Secrets."
          else
            echo "No release keystore configured; using generated debug signing for CI validation only."
          fi
      - name: Build Release APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace --build-cache :app:assembleRelease

      - name: Verify APK metadata and production bundle
        env:
          BUILD_TOOLS: ${{ env.ANDROID_HOME }}/build-tools/${{ env.ANDROID_BUILD_TOOLS }}
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee apk-badging.txt
          grep -F "package: name='com.app.pumprcamobile'" apk-badging.txt
          grep -F "versionCode='12'" apk-badging.txt
          grep -F "versionName='1.0.6'" apk-badging.txt
          grep -F "application-label:'Надёжкин'" apk-badging.txt
          unzip -l "$APK" | grep -E 'assets/.*(bundle|index)' | head -20
          if ! unzip -p "$APK" assets/index.android.bundle 2>/dev/null | grep -aFq 'pump-rca-ntbesymu.manus.space'; then
            echo 'Production API URL was not found in the embedded JS bundle.' >&2
            exit 1
          fi
          sha256sum "$APK" | tee apk-sha256.txt

      - name: Upload APK and verification files
        uses: actions/upload-artifact@v4
        with:
          name: nadezhkin-release-apk-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 30
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            apk-badging.txt
            apk-sha256.txt
